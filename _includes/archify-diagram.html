{% assign steps = include.steps | split: "|" %}
<figure class="guide-diagram">
  <ol class="guide-diagram__steps" aria-label="{{ include.title }}の流れ">
    {% for step in steps %}
      <li>
        <span class="guide-diagram__number" aria-hidden="true">{{ forloop.index }}</span>
        <strong>{{ step }}</strong>
      </li>
    {% endfor %}
  </ol>
  <figcaption>{{ include.summary }}</figcaption>
  <p class="guide-diagram__link"><a href="{{ include.src | relative_url }}">操作できる全体図を開く</a></p>
</figure>
