<text x="650.0" y="257.0" text-anchor="middle" font-size="13" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">verify #2</text>
<rect x="60" y="205" width="170" height="120" rx="18" fill="#F3F0FF" stroke="#7755BB" stroke-width="2"/>
