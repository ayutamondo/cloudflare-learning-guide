<rect x="60" y="532" width="1080" height="48" rx="12" fill="#F7F7F7"/>
<text x="80" y="561" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#333">525はTLS handshake失敗、526はOrigin証明書検証失敗を疑う。エラーコードから区間を切り分ける。</text>
