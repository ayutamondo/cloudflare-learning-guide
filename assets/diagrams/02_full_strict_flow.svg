<text x="358" y="241" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Valid hostname</text>
<text x="358" y="263" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">TLS policy</text>
<rect x="720" y="160" width="260" height="210" rx="18" fill="#F5F5F5" stroke="#666" stroke-width="2"/>
