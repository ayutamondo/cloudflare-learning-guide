<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="60" y="58" font-size="30" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">HA と DR は別問題</text>
<text x="60" y="91" font-size="16" font-family="Arial, Noto Sans JP, sans-serif" fill="#555">日常故障を自動吸収する設計と、大規模障害から復旧する設計を分ける</text>
<rect x="80" y="155" width="420" height="230" rx="18" fill="#FFF4E8" stroke="#F48120" stroke-width="2"/>
<text x="98" y="188" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">High Availability</text>
<text x="98" y="214" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Health checks</text>
<text x="98" y="236" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Active/active or failover</text>
<text x="98" y="258" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Automatic traffic steering</text>
<text x="98" y="280" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Seconds–minutes</text>
<rect x="700" y="155" width="420" height="230" rx="18" fill="#EFF8F8" stroke="#3C8585" stroke-width="2"/>
<text x="718" y="188" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Disaster Recovery</text>
<text x="718" y="214" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Backup / restore</text>
<text x="718" y="236" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Alternate region/provider</text>
<text x="718" y="258" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Runbook / RTO / RPO</text>
<text x="718" y="280" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Minutes–hours+</text>
<rect x="60" y="532" width="1080" height="48" rx="12" fill="#F7F7F7"/>
<text x="80" y="561" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#333">Load Balancerを入れただけではDRにならない。データ復旧、DNS/証明書、権限、手順、人員まで含める。</text>
