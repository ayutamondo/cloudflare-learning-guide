<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="60" y="58" font-size="30" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Redirect と Rewrite</text>
<text x="60" y="91" font-size="16" font-family="Arial, Noto Sans JP, sans-serif" fill="#555">ブラウザにURL変更を見せるかどうかが本質的な違い</text>
<line x1="240" y1="195.0" x2="340" y2="195.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="560" y1="195.0" x2="730" y2="195.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="240" y1="400.0" x2="340" y2="400.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="560" y1="400.0" x2="730" y2="400.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="60" y="145" width="180" height="100" rx="18" fill="#F3F0FF" stroke="#7755BB" stroke-width="2"/>
<text x="78" y="178" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Client</text>
<text x="78" y="204" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">GET /old</text>
<rect x="340" y="135" width="220" height="120" rx="18" fill="#EEF5FF" stroke="#3B6FD8" stroke-width="2"/>
<text x="358" y="168" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Redirect Rule</text>
<text x="358" y="194" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">301 / 302</text>
<text x="358" y="216" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Location: /new</text>
<rect x="730" y="145" width="180" height="100" rx="18" fill="#F3F0FF" stroke="#7755BB" stroke-width="2"/>
<text x="748" y="178" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Client</text>
<text x="748" y="204" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">GET /new</text>
<rect x="60" y="350" width="180" height="100" rx="18" fill="#F3F0FF" stroke="#7755BB" stroke-width="2"/>
<text x="78" y="383" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Client</text>
<text x="78" y="409" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">GET /public</text>
<rect x="340" y="340" width="220" height="120" rx="18" fill="#EEF5FF" stroke="#3B6FD8" stroke-width="2"/>
<text x="358" y="373" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">URL Rewrite</text>
<text x="358" y="399" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Internally /backend</text>
<text x="358" y="421" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">URL unchanged</text>
<rect x="730" y="350" width="180" height="100" rx="18" fill="#F5F5F5" stroke="#666" stroke-width="2"/>
<text x="748" y="383" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Origin</text>
<text x="748" y="409" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">/backend</text>
<rect x="60" y="532" width="1080" height="48" rx="12" fill="#F7F7F7"/>
<text x="80" y="561" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#333">SEO・canonical・利用者のURL変更が必要ならRedirect。内部ルーティングだけ変えるならRewrite。</text>
</svg>