<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="60" y="58" font-size="30" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Data製品選定フロー</text>
<text x="60" y="91" font-size="16" font-family="Arial, Noto Sans JP, sans-serif" fill="#555">要件を質問に変えると選びやすい</text>
<line x1="240" y1="265.0" x2="320" y2="145.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="240" y1="265.0" x2="320" y2="285.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="240" y1="265.0" x2="320" y2="425.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="510" y1="145.0" x2="650" y2="210.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="510" y1="285.0" x2="650" y2="210.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="510" y1="425.0" x2="650" y2="390.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="860" y1="210.0" x2="960" y2="290.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="860" y1="390.0" x2="960" y2="290.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="60" y="205" width="180" height="120" rx="18" fill="#F3F0FF" stroke="#7755BB" stroke-width="2"/>
<text x="78" y="238" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Data Need</text>
<text x="78" y="264" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">What access pattern?</text>
<rect x="320" y="90" width="190" height="110" rx="18" fill="#F1F8EF" stroke="#4D8B31" stroke-width="2"/>
<text x="338" y="123" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Large objects?</text>
<text x="338" y="149" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Yes → R2</text>
<rect x="320" y="230" width="190" height="110" rx="18" fill="#F1F8EF" stroke="#4D8B31" stroke-width="2"/>
<text x="338" y="263" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Relational SQL?</text>
<text x="338" y="289" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Yes → D1</text>
<rect x="320" y="370" width="190" height="110" rx="18" fill="#F1F8EF" stroke="#4D8B31" stroke-width="2"/>
<text x="338" y="403" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Coordination?</text>
<text x="338" y="429" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Yes → DO</text>
<rect x="650" y="150" width="210" height="120" rx="18" fill="#F1F8EF" stroke="#4D8B31" stroke-width="2"/>
<text x="668" y="183" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Read-heavy config?</text>
<text x="668" y="209" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Yes → KV</text>
<rect x="650" y="330" width="210" height="120" rx="18" fill="#EFF8F8" stroke="#3C8585" stroke-width="2"/>
<text x="668" y="363" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Async processing?</text>
<text x="668" y="389" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Yes → Queues</text>
<rect x="960" y="230" width="180" height="120" rx="18" fill="#F5F5F5" stroke="#666" stroke-width="2"/>
<text x="978" y="263" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Existing SQL?</text>
<text x="978" y="289" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Hyperdrive</text>
<rect x="60" y="532" width="1080" height="48" rx="12" fill="#F7F7F7"/>
<text x="80" y="561" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#333">実際は複数併用が普通。例: D1=メタデータ、R2=ファイル、Queue=非同期変換。</text>
</svg>