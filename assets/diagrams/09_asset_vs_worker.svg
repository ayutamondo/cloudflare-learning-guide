<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="60" y="58" font-size="30" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Asset-first と Worker-first</text>
<text x="60" y="91" font-size="16" font-family="Arial, Noto Sans JP, sans-serif" fill="#555">静的ファイルまでWorkerを通すかでコストと柔軟性が変わる</text>
<line x1="230" y1="265.0" x2="340" y2="170.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="230" y1="265.0" x2="340" y2="390.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="560" y1="170.0" x2="760" y2="275.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="560" y1="390.0" x2="760" y2="275.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="60" y="205" width="170" height="120" rx="18" fill="#F3F0FF" stroke="#7755BB" stroke-width="2"/>
<text x="78" y="238" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Request</text>
<text x="78" y="264" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">/assets/app.js</text>
<text x="78" y="286" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">/api/items</text>
<rect x="340" y="110" width="220" height="120" rx="18" fill="#FFF4E8" stroke="#F48120" stroke-width="2"/>
<text x="358" y="143" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Asset-first</text>
<text x="358" y="169" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Static hit → return</text>
<text x="358" y="191" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">No Worker CPU</text>
<rect x="340" y="330" width="220" height="120" rx="18" fill="#EEF5FF" stroke="#3B6FD8" stroke-width="2"/>
<text x="358" y="363" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Worker-first</text>
<text x="358" y="389" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Worker sees request</text>
<text x="358" y="411" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Then asset/origin</text>
<rect x="760" y="205" width="240" height="140" rx="18" fill="#F5F5F5" stroke="#666" stroke-width="2"/>
<text x="778" y="238" font-size="18" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Response</text>
<text x="778" y="264" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Choose per route</text>
<text x="778" y="286" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Selective strategy</text>
<rect x="60" y="532" width="1080" height="48" rx="12" fill="#F7F7F7"/>
<text x="80" y="561" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#333">認証・A/B・動的headerが不要な静的assetはAsset-firstが単純。必要なpathだけWorker-firstにする。</text>
