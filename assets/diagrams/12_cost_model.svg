<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="58" font-size="30" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">料金はリクエストの流れで見る</text>
<text x="60" y="91" font-size="16" font-family="Arial, Noto Sans JP, sans-serif" fill="#555">どの処理が何回発生し、どの従量課金を生むかを分解する</text>
<line x1="250" y1="260.0" x2="330" y2="255.0" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="550" y1="255.0" x2="650" y2="255.0" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="870" y1="255.0" x2="970" y2="255.0" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="190" width="190" height="140" rx="18" fill="#F3F0FF" stroke="#7755BB" stroke-width="2"/>
<text x="80" y="224" font-size="19" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Traffic</text>
<text x="80" y="251" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Requests</text>
<text x="80" y="273" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Bandwidth</text>
<rect x="330" y="145" width="220" height="220" rx="18" fill="#FFF4E8" stroke="#F48120" stroke-width="2"/>
