<text x="350" y="206" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Plan features</text>
<text x="350" y="228" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Cache</text>
<text x="350" y="250" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Security</text>
<rect x="650" y="145" width="220" height="220" rx="18" fill="#EEF5FF" stroke="#3B6FD8" stroke-width="2"/>
<text x="670" y="179" font-size="19" font-weight="700" font-family="Arial, Noto Sans JP, sans-serif" fill="#111">Compute</text>
<text x="670" y="206" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Worker requests</text>
<text x="670" y="228" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">CPU time</text>
