<text x="990" y="206" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">R2 ops</text>
<text x="990" y="228" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">D1 rows</text>
<text x="990" y="250" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#444">Storage</text>
<rect x="60" y="534" width="1080" height="48" rx="12" fill="#F7F7F7"/>
<text x="80" y="563" font-size="14" font-family="Arial, Noto Sans JP, sans-serif" fill="#333">「Free/Proどちらか」だけでなく、Workers・R2・D1等の従量課金をワークロード単位で見積もる。</text>
