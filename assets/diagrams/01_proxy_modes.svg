<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L0,10 L13,5 z" fill="#263844"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#f7f6f1"/>
  <rect x="0" y="0" width="24" height="720" fill="#1e4b61"/>
  <text x="64" y="82" font-size="44" font-weight="700" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#202126">Proxied と DNS only</text>
  <text x="66" y="121" font-size="24" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#50545a">Cloudflareが通信経路に入るかどうかは、レコードのプロキシ設定で決まる。</text>

  <text x="66" y="177" font-size="20" font-weight="700" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#b84335">PROXIED — Cloudflareを経由する</text>
  <rect x="66" y="198" width="230" height="132" rx="10" fill="#e7e1fa" stroke="#6545ae" stroke-width="3"/>
  <text x="92" y="250" font-size="28" font-weight="700" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#202126">利用者</text>
  <text x="92" y="286" font-size="21" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#50545a">ブラウザ / API</text>
  <line x1="296" y1="264" x2="400" y2="264" stroke="#263844" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="412" y="183" width="300" height="162" rx="10" fill="#dce8e7" stroke="#1e4b61" stroke-width="4"/>
  <text x="440" y="236" font-size="29" font-weight="700" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#202126">Cloudflare Edge</text>
  <text x="440" y="275" font-size="21" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#1e4b61">WAF ・ Cache ・ Workers</text>
  <text x="440" y="309" font-size="21" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#50545a">TLSを終端し、保護・最適化する</text>
  <line x1="712" y1="264" x2="820" y2="264" stroke="#263844" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="832" y="198" width="250" height="132" rx="10" fill="#e6e5df" stroke="#5e6165" stroke-width="3"/>
  <text x="860" y="250" font-size="28" font-weight="700" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#202126">オリジン</text>
  <text x="860" y="286" font-size="21" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#50545a">IPは直接返さない</text>

  <line x1="66" y1="386" x2="1082" y2="386" stroke="#b7b7b2" stroke-width="2"/>
  <text x="66" y="433" font-size="20" font-weight="700" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#50545a">DNS ONLY — 名前解決だけを行う</text>
  <rect x="66" y="454" width="230" height="132" rx="10" fill="#e7e1fa" stroke="#6545ae" stroke-width="3"/>
  <text x="92" y="506" font-size="28" font-weight="700" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#202126">利用者</text>
  <text x="92" y="542" font-size="21" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#50545a">DNSを問い合わせる</text>
  <line x1="296" y1="520" x2="400" y2="520" stroke="#263844" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="412" y="454" width="300" height="132" rx="10" fill="#f1f0ea" stroke="#85888a" stroke-width="3"/>
  <text x="440" y="506" font-size="28" font-weight="700" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#202126">DNSの応答</text>
  <text x="440" y="542" font-size="21" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#50545a">オリジンIPを返すだけ</text>
  <line x1="712" y1="520" x2="820" y2="520" stroke="#263844" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="832" y="454" width="250" height="132" rx="10" fill="#e6e5df" stroke="#5e6165" stroke-width="3"/>
  <text x="860" y="506" font-size="28" font-weight="700" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#202126">オリジン</text>
  <text x="860" y="542" font-size="21" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#50545a">直接アクセスされる</text>

  <rect x="66" y="628" width="1016" height="56" rx="8" fill="#1e4b61"/>
  <text x="92" y="665" font-size="22" font-weight="700" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#fff">確認ポイント：Web用のホスト名がDNS onlyになっていると、WAF・Cache・Workersは効かない。</text>
</svg>
